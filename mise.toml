[tools]
swiftformat = "latest"
swiftlint = "latest"
"pipx:dmgbuild" = "latest"

[env]
APP = "build/Webcam.app"

[tasks.build]
description = "Compile and bundle build/Webcam.app"
sources = ["Sources/**/*.swift", "Resources/*"]
outputs = ["build/Webcam.app/Contents/MacOS/Webcam"]
run = """
rm -rf "$APP"
mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
swiftc -O -swift-version 6 -o "$APP/Contents/MacOS/Webcam" Sources/*.swift
cp Resources/Info.plist "$APP/Contents/"
cp Resources/AppIcon.icns "$APP/Contents/Resources/"
codesign --force --sign - "$APP"
"""

[tasks.run]
description = "Build and open the app"
depends = ["build"]
run = "open \"$APP\""

[tasks.install]
description = "Copy the app to ~/Applications"
depends = ["build"]
run = """
mkdir -p ~/Applications
rm -rf ~/Applications/Webcam.app
cp -R "$APP" ~/Applications/
"""

[tasks.dmg]
description = "Package build/Webcam.dmg with a drag-to-Applications window"
depends = ["build"]
run = """
rm -rf build/dmg build/Webcam.dmg
mkdir -p build/dmg
swift scripts/dmg-background.swift build/dmg
tiffutil -cathidpicheck build/dmg/background.png build/dmg/background@2x.png -out build/dmg/background.tiff
dmgbuild -s scripts/dmg.py -D app="$APP" -D background=build/dmg/background.tiff Webcam build/Webcam.dmg
"""

[tasks.format]
description = "Format Swift sources"
run = "swiftformat ."

[tasks.lint]
description = "Check formatting and lint"
run = ["swiftformat --lint .", "swiftlint --strict --quiet"]

[tasks.icon]
description = "Regenerate Resources/AppIcon.icns"
run = "scripts/icon.sh"

[tasks.clean]
description = "Remove build output"
run = "rm -rf build"
